version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21
    commands:
      - cp aws/m2/settings.xml /root/.m2/settings.xml

  pre_build:
    commands:
      - echo Entering the pre_build phase...
      - mkdir ./aws/winsw
      - wget -O ./aws/winsw/winsw.exe https://repo.jenkins-ci.org/releases/com/sun/winsw/winsw/2.9.0/winsw-2.9.0-net461.exe

  build:
    commands:
      - echo Entered the build phase...
      - echo Build started on `date`
      - mvn -T 1 $AWD_SKIPTESTS install -U
      - chmod +x ./aws/scripts/copy-appspec.sh
      - ./aws/scripts/copy-appspec.sh

artifacts:
  files:
    - '**/target/**.zip'
  discard-paths: yes
cache:
  paths:
    - "/root/.m2/**/*"
