server:
  port: 8082
spring:
  application:
    name: schema-service
  threads:
    virtual:
      enabled: true
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
    name: "oracle"
    hikari:
      maximumPoolSize: 100
      minimumIdle: 10
      connectionTimeout: 50000
  flyway:
    enabled: true
    locations: "classpath:db/migration"
    schemas: "SCHMDB"
    placeholders:
      clob: "${clob.${spring.datasource.name}_clob}"
      timestamp: "${timestamp.${spring.datasource.name}_ts}"
  jpa:
    properties:
      hibernate:
        multiTenancy: DISCRIMINATOR
        tenant_identifier_resolver: com.ssnc.schemaService.tenant.TenantIdentifierResolver
        show_sql: true
        format_sql: true
clob:
  oracle_clob: "CLOB"
  sqlserver_clob: "NVARCHAR(max)"
  postgresql_clob: "text"
timestamp:
  oracle_ts: "TIMESTAMP"
  sqlserver_ts: "DATETIME2"
  postgresql_ts: "DATE"
