logging:
  level:
    root: "INFO"

spring:
  application:
    name: schema-service-test
  datasource:
    url: "jdbc:h2:mem:testdb;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS SCHMDB"
    username: "sa"
    password: ""
    name: "h2"
    driver-class-name: "org.h2.Driver"
    hikari:
      maximumPoolSize: 10
      minimumIdle: 2
      connectionTimeout: 30000
  flyway:
    enabled: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: SCHMDB
        multiTenancy: DISCRIMINATOR
        tenant_identifier_resolver: com.ssnc.schemaService.tenant.TenantIdentifierResolver
        show_sql: false
        format_sql: false
  h2:
    console:
      enabled: false

clob:
  h2_clob: "CLOB"

timestamp:
  h2_ts: "TIMESTAMP"

guid:
  h2_guid: "UUID"

bpm:
  security:
    jwt:
      enabled: false
